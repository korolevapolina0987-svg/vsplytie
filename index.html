:root {
  --ink: #e8f3ff;
  --muted: rgba(220, 236, 255, .62);
  --faint: rgba(220, 236, 255, .38);
  --glass: rgba(6, 14, 30, .78);
  --glass2: rgba(16, 32, 60, .7);
  --line: rgba(140, 200, 255, .15);
  --gold: #ffd166;
  --cyan: #5ad1e6;
  --red: #ff6b6b;
  --green: #7ee0a1;
  --r: 18px;
  --sheet-w: 420px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; color: var(--ink); font: 400 15px/1.45 Manrope, system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea { font: inherit; color: var(--ink); }
#scene { position: fixed; inset: 0; display: block; }
h1, h2, h3, .depth { font-family: Unbounded, Manrope, sans-serif; font-weight: 600; letter-spacing: -.01em; }

/* ---------- HUD ---------- */
.hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(12px + var(--safe-t)) 16px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; z-index: 5; transition: opacity .6s; }
.hud > * { pointer-events: auto; }
.depth { font-size: clamp(28px, 8vw, 40px); line-height: 1; text-shadow: 0 2px 18px rgba(0, 0, 0, .6); font-variant-numeric: tabular-nums; }
.depth small { font-size: .45em; margin-left: 4px; color: var(--muted); }
.zone { margin-top: 6px; font-size: 13px; color: var(--cyan); font-weight: 700; letter-spacing: .02em; }
.lvl { margin-top: 10px; display: grid; grid-template-columns: auto; gap: 4px; font-size: 12px; color: var(--muted); }
.lvl #lvl { color: var(--ink); font-weight: 700; }
.bar { width: min(220px, 52vw); height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--gold)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.hud-btns { display: flex; gap: 6px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--glass2); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { transform: scale(.94); }

/* ---------- Нижняя панель ---------- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; height: min(54vh, 520px); display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0; z-index: 4; transition: height .45s cubic-bezier(.2, .8, .2, 1), transform .6s cubic-bezier(.2, .8, .2, 1); padding-bottom: var(--safe-b); }
.sheet.mini { height: calc(104px + var(--safe-b)); }
.handle { display: block; width: 100%; height: 22px; padding: 0; }
.handle i { display: block; width: 44px; height: 5px; border-radius: 9px; background: rgba(255, 255, 255, .25); margin: 9px auto 0; }
.tabs { display: flex; gap: 4px; padding: 0 12px 8px; }
.tabs button { flex: 1; min-height: 40px; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; transition: background .2s, color .2s; }
.tabs button.on { background: rgba(90, 209, 230, .14); color: var(--ink); }
.tabs b { font-size: 10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: rgba(255, 255, 255, .12); display: inline-grid; place-items: center; }
.tabs b:empty { display: none; }
.tabs b.hot { background: var(--gold); color: #2a1d00; }
.panels { flex: 1; overflow: hidden; position: relative; }
.panel { position: absolute; inset: 0; overflow-y: auto; padding: 4px 14px 24px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .25s, transform .25s; overscroll-behavior: contain; }
.panel.on { opacity: 1; pointer-events: auto; transform: none; }
.sheet.mini .panels { visibility: hidden; }

.sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 700; margin: 14px 2px 8px; }
.sec-title:first-child { margin-top: 2px; }

/* дела */
.tasks { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px 10px 10px; min-height: 60px; border-radius: 16px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); transition: transform .12s, background .2s; }
.task:active { transform: scale(.97); background: rgba(90, 209, 230, .12); }
.task .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255, 255, 255, .06); }
.task .nm { font-weight: 700; line-height: 1.25; }
.task .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.task .pts { font-family: Unbounded, sans-serif; font-weight: 600; font-size: 15px; color: var(--gold); }
.task.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 40% { transform: scale(1.04); background: rgba(255, 209, 102, .18); } }
.log { display: grid; gap: 4px; }
.log-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding: 4px 2px; }
.log-row span:nth-child(2) { flex: 1; color: var(--ink); }
.log-row button { width: 32px; height: 32px; border-radius: 10px; color: var(--faint); }
.log-row button:active { background: rgba(255, 107, 107, .15); color: var(--red); }
.empty { color: var(--faint); font-size: 13px; padding: 6px 2px; }

/* неделя */
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.week-head h3 { margin: 4px 0 0; font-size: 17px; }
.week-head span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.rule { margin: 10px 0 4px; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.rule b.up { color: var(--gold); } .rule b.down { color: var(--red); }
.goal { padding: 10px 2px; border-bottom: 1px solid var(--line); }
.goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.goal-top .cnt { font-weight: 700; font-variant-numeric: tabular-nums; }
.goal.done .cnt { color: var(--green); }
.goal .bar { width: 100%; margin-top: 7px; }
.goal.done .bar i { background: var(--green); }
.hist { display: flex; flex-wrap: wrap; gap: 6px; }
.hist span { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, .05); color: var(--faint); border: 1px solid var(--line); }
.hist span.ok { background: rgba(126, 224, 161, .14); color: var(--green); border-color: rgba(126, 224, 161, .3); }
.hist span.fail { background: rgba(255, 107, 107, .12); color: var(--red); border-color: rgba(255, 107, 107, .3); }
.hist span.cur { border-color: var(--cyan); color: var(--ink); }

/* находки */
.finds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.find { aspect-ratio: 1; border-radius: 16px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); display: grid; place-items: center; position: relative; padding: 4px; }
.find canvas { width: 70%; height: 70%; }
.find small { position: absolute; bottom: 5px; left: 4px; right: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; font-size: 10px; color: var(--faint); font-weight: 700; }
.find.has { background: radial-gradient(circle at 50% 45%, rgba(255, 209, 102, .16), rgba(255, 255, 255, .03) 70%); border-color: rgba(255, 209, 102, .25); }
.find.has:active { transform: scale(.95); }
.find-progress { font-size: 13px; color: var(--muted); margin: 2px 2px 10px; }

/* ачивки */
.achs { display: grid; gap: 6px; }
.ach { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
.ach .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255, 209, 102, .12); }
.ach.locked { opacity: .5; }
.ach.locked .ic { filter: grayscale(1); background: rgba(255, 255, 255, .05); }
.ach .nm { font-weight: 700; }
.ach .ds { font-size: 12px; color: var(--muted); }

/* ---------- Кнопки, поля ---------- */
.btn { min-height: 48px; padding: 12px 18px; border-radius: 14px; font-weight: 700; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); transition: transform .12s, filter .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, #ffe08a, var(--gold)); color: #2a1d00; border: 0; box-shadow: 0 8px 30px rgba(255, 209, 102, .25); }
.btn.danger { color: var(--red); border-color: rgba(255, 107, 107, .3); }
.btn.ghost { background: none; border: 0; color: var(--muted); font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
.btn.big { width: 100%; min-height: 56px; font-size: 17px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.field input, textarea, .trow input { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); outline: none; }
.field input:focus, textarea:focus, .trow input:focus { border-color: var(--cyan); }
textarea { min-height: 90px; resize: vertical; font-size: 12px; word-break: break-all; }

/* ---------- Старт ---------- */
.start[hidden] { display: none; }
.start { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px 20px calc(24px + var(--safe-b)); background: radial-gradient(ellipse at 50% 120%, rgba(30, 80, 140, .35), transparent 60%), rgba(1, 3, 9, .55); overflow-y: auto; }
.start-inner { width: min(420px, 100%); display: grid; gap: 14px; text-align: center; animation: rise 1s cubic-bezier(.2, .8, .2, 1) both; }
.start h1 { font-size: clamp(44px, 14vw, 72px); margin: 0; line-height: .95; background: linear-gradient(180deg, #fff, #9fd6e4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kicker { margin: 0; color: var(--cyan); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
.lead { margin: 0; color: var(--muted); font-size: 16px; }
.facts { list-style: none; padding: 0; margin: 4px 0; display: flex; justify-content: center; gap: 18px; color: var(--muted); font-size: 13px; }
.facts b { display: block; font-family: Unbounded, sans-serif; font-size: 22px; color: var(--ink); }
.start .field { text-align: left; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }

/* ---------- Тосты ---------- */
.toasts { position: fixed; left: 50%; top: calc(120px + var(--safe-t)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 15; width: min(360px, calc(100% - 32px)); pointer-events: none; }

<script>
/* ===== Логика: прогресс, недели, сохранения ===== */
const DAY = 864e5;
const now = () => Date.now() + (window.__timeOffset || 0);
function dayKey(ts) { const d = new Date(ts); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); }
function weekday(ts) { return (new Date(ts).getDay() + 6) % 7; } // Пн = 0
const clone = o => JSON.parse(JSON.stringify(o));

const Game = {
  state: null,

  fresh(name) {
    const ts = now();
    return {
      v: CFG.SAVE_V, name: (name || '').trim().slice(0, 24), created: ts,
      startDay: dayKey(ts) - weekday(ts), warmup: weekday(ts) >= 3,
      tasks: clone(DEFAULT_TASKS), log: [], weeks: [], resolvedThrough: -1,
      weekGoals: {}, found: [], ach: {}, maxLevel: 0, bestStreak: 0,
      muted: false, seq: 1,
    };
  },

  // --- время ---
  weekOf(ts) { return Math.floor((dayKey(ts) - this.state.startDay) / 7); },
  curWeek() { return this.weekOf(now()); },
  daysLeft() { const end = this.state.startDay + (this.curWeek() + 1) * 7; return end - dayKey(now()); },
  goalsNow() { const g = {}; this.state.tasks.forEach(t => { if (t.goal > 0) g[t.id] = t.goal; }); return g; },
  goalsFor(w) { return this.state.weekGoals[w] || this.goalsNow(); },
  ensureWeekGoals() { const w = this.curWeek(); if (!this.state.weekGoals[w]) this.state.weekGoals[w] = this.goalsNow(); },
  isWarmup(w) { return w === 0 && this.state.warmup; },

  // --- очки и уровни ---
  rawXp() { let x = 0; for (const e of this.state.log) x += e.pts; for (const r of this.state.weeks) x += r.delta; return x; },
  xp() { return Math.max(0, Math.min(this.rawXp(), CFG.LEVELS * CFG.XPL)); },
  levelFloat() { return this.xp() / CFG.XPL; },
  level() { return Math.floor(this.levelFloat()); },
  task(id) { return this.state.tasks.find(t => t.id === id); },

  counts(w) {
    const c = {};
    for (const e of this.state.log) if (w === undefined || this.weekOf(e.ts) === w) c[e.t] = (c[e.t] || 0) + 1;
    return c;
  },
  weekEntries() { const w = this.curWeek(); return this.state.log.filter(e => this.weekOf(e.ts) === w).slice().reverse(); },

  logTask(id) {
    const t = this.task(id); if (!t) return null;
    const before = this.level();
    this.state.log.push({ id: this.state.seq++, t: id, ts: now(), pts: t.pts });
    return this.progress(before);
  },
  removeEntry(entryId) {
    const i = this.state.log.findIndex(e => e.id === entryId);
    if (i < 0 || this.weekOf(this.state.log[i].ts) !== this.curWeek()) return false;
    this.state.log.splice(i, 1);
    return true;
  },

  // события после изменения очков
  progress(before) {
    const ev = [];
    const lvl = this.level();
    if (lvl > before) ev.push({ type: 'level', level: lvl, first: lvl > this.state.maxLevel });
    if (lvl > this.state.maxLevel) {
      for (const it of ITEMS) if (it.lv <= lvl && !this.state.found.includes(it.id)) { this.state.found.push(it.id); ev.push({ type: 'item', item: it }); }
      const was = this.state.maxLevel; this.state.maxLevel = lvl;
      if (lvl >= CFG.LEVELS && was < CFG.LEVELS) ev.push({ type: 'surface' });
    }
    this.state.bestStreak = Math.max(this.state.bestStreak, this.streak());
    for (const a of ACH) if (!this.state.ach[a.id] && a.test(this.stats())) { this.state.ach[a.id] = now(); ev.push({ type: 'ach', ach: a }); }
    return ev;
  },

  // --- недельные испытания ---
  resolve() {
    const out = [];
    const cur = this.curWeek();
    for (let w = this.state.resolvedThrough + 1; w < cur; w++) {
      const goals = this.goalsFor(w), done = this.counts(w);
      const ids = Object.keys(goals);
      const ok = ids.length > 0 && ids.every(id => (done[id] || 0) >= goals[id]);
      const before = this.level();
      let delta = 0;
      if (ok) delta = CFG.WEEK_BONUS * CFG.XPL;
      else if (ids.length && !this.isWarmup(w)) delta = -Math.min(CFG.WEEK_FALL * CFG.XPL, this.rawXp());
      const prev = this.state.weeks[this.state.weeks.length - 1];
      const r = { w, ok, delta, goals, done, warm: this.isWarmup(w), after: prev && !prev.ok && prev.delta < 0 };
      this.state.weeks.push(r);
      this.state.resolvedThrough = w;
      r.events = this.progress(before);
      out.push(r);
    }
    this.ensureWeekGoals();
    return out;
  },

  // --- статистика ---
  streak() {
    const days = new Set(this.state.log.map(e => dayKey(e.ts)));
    let d = dayKey(now()); if (!days.has(d)) d--;
    let s = 0; while (days.has(d)) { s++; d--; }
    return s;
  },
  stats() {
    const c = new Proxy(this.counts(), { get: (o, k) => o[k] || 0 });
    let weeksOk = 0, run = 0, bestOkRun = 0, comeback = false;
    this.state.weeks.forEach((r, i) => {
      if (r.ok) { weeksOk++; run++; bestOkRun = Math.max(bestOkRun, run); const p = this.state.weeks[i - 1]; if (p && !p.ok && p.delta < 0) comeback = true; }
      else run = 0;
    });
    return {
      c, total: this.state.log.length, bestStreak: Math.max(this.state.bestStreak, this.streak()),
      weeksOk, bestOkRun, comeback, found: this.state.found.length,
      maxLevel: this.state.maxLevel, bestDepth: depthFor(this.state.maxLevel),
    };
  },

  // --- сохранения ---
  save() { try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(this.state)); } catch (e) { } },
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(CFG.SAVE_KEY) || 'null');
      if (s && s.v === CFG.SAVE_V && Array.isArray(s.log)) { this.state = s; return true; }
    } catch (e) { }
    return false;
  },
  exportCode() { return 'VSP1:' + btoa(unescape(encodeURIComponent(JSON.stringify(this.state)))); },
  importCode(code) {
    try {
      code = (code || '').trim();
      let json = code.startsWith('VSP1:') ? decodeURIComponent(escape(atob(code.slice(5)))) : code;
      const s = JSON.parse(json);
      if (!s || s.v !== CFG.SAVE_V || !Array.isArray(s.log) || !Array.isArray(s.tasks)) return false;
      this.state = s; this.save(); return true;
    } catch (e) { return false; }
  },
};

<script>
/* ===== Сцена: впадина на canvas ===== */
const Scene = (() => {
  const LH = 170, L = CFG.LEVELS, YB = L * LH;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv, c, W = 0, H = 0, dpr = 1;
  let view = { x: 0, w: 0, focusY: 0 };
  let disp = 0, target = 0, follow = 2.2, vel = 0;
  let camY = 0, t = 0, last = 0, trauma = 0, flashA = 0, flashCol = '#fff';
  let intro = null, found = [];
  const snow = [], bubbles = [], parts = [], floats = [], jellies = [], schools = [];

  const PAL = [
    [0, '#020409', '#06080e', '#1a2a48'],
    [20, '#030816', '#070c17', '#1d3966'],
    [40, '#061a33', '#0a1526', '#255384'],
    [58, '#0b3658', '#0f2538', '#3a77a2'],
    [70, '#16628d', '#173a4b', '#62a7c3'],
    [80, '#3ea9d1', '#28525e', '#9fd6e4'],
  ];
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const PALRGB = PAL.map(p => [p[0], hex(p[1]), hex(p[2]), hex(p[3])]);
  function pal(lv, idx) {
    lv = Math.max(0, Math.min(L, lv));
    for (let i = 1; i < PALRGB.length; i++) {
      if (lv <= PALRGB[i][0]) {
        const a = PALRGB[i - 1], b = PALRGB[i], k = (lv - a[0]) / (b[0] - a[0]);
        const r = a[idx].map((v, j) => Math.round(v + (b[idx][j] - v) * k));
        return `rgb(${r[0]},${r[1]},${r[2]})`;

    const r = PALRGB[PALRGB.length - 1][idx]; return `rgb(${r[0]},${r[1]},${r[2]})`;
  }

  // псевдослучайность с зерном — мир одинаковый при каждом запуске
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  const yOf = lv => (L - lv) * LH;
  const lvOfY = y => L - y / LH;
  const cx = () => view.x + view.w / 2;
  const mobile = () => view.w < 640;
  function half(y) {
    const k = 1 - Math.max(0, Math.min(1, y / YB));
    const h = mobile() ? 118 + 70 * k : 210 + 140 * k;
    return Math.min(view.w / 2 - 16, h);
  }
  const nL = y => 10 * Math.sin(y * 0.011) + 7 * Math.sin(y * 0.027 + 1.3) + 4 * Math.sin(y * 0.063 + 0.4);
  const nR = y => 10 * Math.sin(y * 0.012 + 2.1) + 7 * Math.sin(y * 0.025 + 0.2) + 4 * Math.sin(y * 0.059 + 2.9);
  const wallL = y => cx() - half(y) + nL(y);
  const wallR = y => cx() + half(y) + nR(y);
  const ledgeLen = () => mobile() ? 56 : 82;
  function ledge(lv) {
    const side = lv % 2 ? -1 : 1, y0 = yOf(lv) + 30;
    const bx = side < 0 ? wallL(y0) : wallR(y0);
    return { side, y0, bx };
  }
  function itemPos(lv) { const g = ledge(lv); return { x: g.bx + (g.side < 0 ? 1 : -1) * ledgeLen() * 0.52, y: g.y0 - 15 }; }

  function init(canvas) {
    cv = canvas; c = cv.getContext('2d');
    for (let i = 0; i < 90; i++) snow.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.4, sp: Math.random() * 0.6 + 0.2, z: Math.random() * 0.6 + 0.2 });
    seed = 11;
    for (let i = 0; i < 46; i++) jellies.push({ lv: rnd() * 56 + 0.5, fx: rnd() * 0.7 - 0.35, s: rnd() * 8 + 7, ph: rnd() * 6, hue: [186, 300, 265, 160][Math.floor(rnd() * 4)] });
    for (let i = 0; i < 12; i++) schools.push({ lv: 56 + rnd() * 24, off: rnd(), sp: (rnd() * 0.04 + 0.02) * (rnd() < 0.5 ? -1 : 1), n: 4 + Math.floor(rnd() * 5) });

  }
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';

  // ---- управление ----
  function setLevel(lf, opt = {}) {
    target = lf;
    if (opt.instant) { disp = lf; camY = yOf(lf) - view.focusY; }
    follow = opt.fast ? 4.5 : 2.2;
  }
  function setFound(list) { found = list.slice(); }
  function shake(v) { if (!reduce) trauma = Math.min(1, trauma + v); }
  function flash(col, a = 0.5) { if (!reduce) { flashCol = col; flashA = a; } }
  function playerPos() {
    return { x: cx() + Math.sin(t * 0.7) * (mobile() ? 10 : 18), y: yOf(disp) };
  }
  function burst(col, n = 26, power = 1) {
    const p = playerPos();
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (Math.random() * 120 + 60) * power; parts.push({ x: p.x, y: p.y - 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 1, col, r: Math.random() * 2.5 + 1.2 }); }
  }
  function floatText(txt, col = '#ffd166') { const p = playerPos(); floats.push({ x: p.x + 26, y: p.y - 40, txt, col, life: 1 }); }
  function levelFx() { burst('#ffd166', 34); flash('#ffe9a8', 0.35); shake(0.25); }
  function itemFx() { burst('#7ef0ff', 40, 1.3); flash('#bff7ff', 0.4); }
  function fallFx() { shake(0.9); flash('#ff5a5a', 0.35); for (let i = 0; i < 30; i++) spawnBubble(true); }
  function bonusFx() { burst('#ffd166', 50, 1.4); flash('#fff1c4', 0.45); }
  function intro_(cb) {

  function spawnBubble(big) {

    const want = yOf(disp) - view.focusY;
    const prevCam = camY;
    camY = intro ? want : camY + (want - camY) * Math.min(1, dt * 5);
    const dCam = camY - prevCam;
    for (const s of snow) {
      s.y += (s.sp * dt * 14 - dCam * s.z) / H;
      if (s.y > 1) { s.y -= 1; s.x = Math.random(); } if (s.y < 0) { s.y += 1; s.x = Math.random(); }
    }

    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy = p.vy * 0.96 - 8 * dt; p.life -= dt * 0.9; }

        const grd = c.createLinearGradient(0, camY, 0, camY + H);

      c.lineTo(view.x + view.w, 6); c.lineTo(view.x, 6); c.fill();

    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
  }

  function drawWalls(camLv) {
    const y0 = Math.max(-20, camY - 30), y1 = Math.min(YB + 60, camY + H + 30);

    const lo = Math.max(1, Math.floor(lvOfY(camY + H + 60))), hi = Math.min(L - 1, Math.ceil(lvOfY(camY - 60)));
    for (let lv = lo; lv <= hi; lv++) {

      c.beginPath(); c.ellipse(x, y, j.s, j.s * 0.7 * pulse, 0, Math.PI, 0); c.fill();
      c.strokeStyle = `hsla(${j.hue},100%,75%,${0.45 * a})`; c.lineWidth = 1;
      for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(x + k * j.s * 0.5, y); for (let q = 1; q < 6; q++) c.lineTo(x + k * j.s * 0.5 + Math.sin(t * 3 + q + j.ph) * 2, y + q * j.s * 0.4); c.stroke(); }
    }
  }
  function drawItems(p) {
    for (const it of ITEMS) {
      const pos = itemPos(it.lv);
      if (pos.y < camY - 60 || pos.y > camY + H + 60) continue;
      const has = found.includes(it.id);
      if (has) {
        const gl = c.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 38);
        gl.addColorStop(0, 'rgba(255,209,102,.35)'); gl.addColorStop(1, 'rgba(255,209,102,0)');
        c.fillStyle = gl; c.beginPath(); c.arc(pos.x, pos.y, 38, 0, 7); c.fill();
        Art.item(c, it.id, pos.x, pos.y + Math.sin(t * 1.5 + it.lv) * 1.5, mobile() ? 0.8 : 0.95);
      } else {
        const pulse = 0.6 + Math.sin(t * 2.4 + it.lv) * 0.4;
        const gl = c.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 26);
        gl.addColorStop(0, `rgba(126,240,255,${0.5 * pulse})`); gl.addColorStop(1, 'rgba(126,240,255,0)');
        c.fillStyle = gl; c.beginPath(); c.arc(pos.x, pos.y, 26, 0, 7); c.fill();
        c.fillStyle = 'rgba(200,250,255,.9)'; c.font = '700 15px Manrope, sans-serif'; c.textAlign = 'center'; c.fillText('?', pos.x, pos.y + 5);
        c.fillStyle = 'rgba(170,225,255,.6)'; c.font = '600 10px Manrope, sans-serif'; c.fillText('ур. ' + it.lv, pos.x, pos.y + 24);
      }
    }
  }
  function drawLabels() {
    c.font = '600 11px Manrope, sans-serif';
    const lo = Math.max(0, Math.floor(lvOfY(camY + H + 40) / 5) * 5), hi = Math.min(L, Math.ceil(lvOfY(camY - 40)));
    for (let lv = lo; lv <= hi; lv += 5) {
      if (lv <= 0 || lv >= L) continue;
      const y = yOf(lv) + 4, side = lv % 2 ? 1 : -1; // напротив уступа
      const x = side < 0 ? wallL(y) + 8 : wallR(y) - 8;
      c.textAlign = side < 0 ? 'left' : 'right';
      c.fillStyle = 'rgba(170,215,255,.42)';
      c.fillText(`−${depthFor(lv).toLocaleString('ru-RU')} м`, x, y);
      c.fillStyle = 'rgba(170,215,255,.25)'; c.fillRect(side < 0 ? x : x - 26, y + 5, 26, 1);
    }
  }

  return {
    init, setView, setLevel, setFound, levelFx, itemFx, fallFx, bonusFx, floatText, shake, intro: intro_,
    debug: () => ({ disp: +disp.toFixed(3), target, camY: Math.round(camY), intro: !!intro, view }),
  };
})();

</script>
<script>
/* ===== Интерфейс ===== */
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[a > 10 && a < 20 ? 2 : b === 1 ? 0 : b >= 2 && b <= 4 ? 1 : 2]; };
  const fmt = n => n.toLocaleString('ru-RU');
  const G = Game;

  // ---------- звук ----------
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, d, type = 'sine', v = 0.08, when = 0, slide) {
    if (G.state && G.state.muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + 0.05);
  }
  const sfx = {
    tap: () => { tone(520, 0.12, 'sine', 0.07); tone(780, 0.14, 'sine', 0.05, 0.05); },
    level: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.07, i * 0.08)),
    item: () => [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, 0.4, 'sine', 0.05, i * 0.06)),
    ach: () => { tone(880, 0.2, 'triangle', 0.06); tone(1320, 0.3, 'triangle', 0.05, 0.1); },
    fall: () => { tone(220, 0.9, 'sawtooth', 0.05, 0, 55); tone(110, 1, 'sine', 0.08, 0.05, 40); },
    bonus: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.06, i * 0.07)),
    undo: () => tone(400, 0.15, 'sine', 0.05, 0, 260),
  };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
  addEventListener('pointerdown', () => audio(), { once: true });

  const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

  // ---------- вид для сцены ----------
  const desktop = () => innerWidth >= 900;
  function updateView() {
    const W = innerWidth, H = innerHeight;
    if (!$('#start').hidden) { Scene.setView({ x: 0, w: W, focusY: H * 0.9 }); return; }
    if (document.body.classList.contains('intro')) { Scene.setView({ x: 0, w: W, focusY: H * 0.48 }); return; }
    if (desktop()) Scene.setView({ x: 0, w: W - 420, focusY: H * 0.56 });
    else {
      const sh = $('#sheet').getBoundingClientRect().height, hud = 150;
      Scene.setView({ x: 0, w: W, focusY: hud + Math.max(60, (H - sh - hud) * 0.62) });
    }
  }
  addEventListener('resize', updateView);
  new ResizeObserver(updateView).observe($('#sheet'));

  // ---------- HUD ----------
  function renderHUD() {
    const lf = G.levelFloat(), lv = Math.floor(lf), d = depthFor(lf), z = zoneFor(d);
    $('#depth').textContent = d === 0 ? '0' : '−' + fmt(d);
    $('#zone').textContent = z.name + ' · ' + z.sub;
    $('#lvl').textContent = lv >= CFG.LEVELS ? 'Ты на поверхности!' : `Уровень ${lv} из ${CFG.LEVELS}`;
    const into = G.xp() - lv * CFG.XPL;
    $('#bar').style.width = (lv >= CFG.LEVELS ? 100 : into / CFG.XPL * 100) + '%';
    $('#xpLeft').textContent = lv >= CFG.LEVELS ? '' : `${CFG.XPL - into} ${plural(CFG.XPL - into, ['очко', 'очка', 'очков'])} до следующего`;
    $('#btnSound').innerHTML = G.state.muted ? ICON_OFF : ICON_ON;
  }

  // ---------- вкладки ----------
  let tab = 'tasks';
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
    $('#sheet').classList.remove('mini');
    if (tab === 'finds') { seenFinds = G.state.found.length; renderBadges(); }
    if (tab === 'ach') { seenAch = Object.keys(G.state.ach).length; renderBadges(); }
  }));
  $('#handle').addEventListener('click', () => $('#sheet').classList.toggle('mini'));
  let seenFinds = 0, seenAch = 0;

  // ---------- Дела ----------
  function renderTasks() {
    const wc = G.counts(G.curWeek());
    const p = $('#p-tasks');
    let h = '<div class="sec-title">Что сделал?</div><div class="tasks">';
    for (const t of G.state.tasks) {
      const n = wc[t.id] || 0, goal = (G.goalsFor(G.curWeek())[t.id]) || 0;
      const meta = goal ? `на этой неделе ${n} из ${goal}` : (n ? `на этой неделе: ${n}` : 'бонус');
      h += `<button class="task" data-id="${esc(t.id)}"><span class="ic">${esc(t.icon)}</span><span><div class="nm">${esc(t.name)}</div><div class="meta">${meta}</div></span><span class="pts">+${t.pts}</span></button>`;
    }
    h += '</div><div class="sec-title">Отмечено на этой неделе</div><div class="log">';
    const ents = G.weekEntries();
    if (!ents.length) h += '<div class="empty">Пока ничего. Первое дело — самое тяжёлое.</div>';
    for (const e of ents.slice(0, 30)) {
      const t = G.task(e.t), d = new Date(e.ts);
      const when = d.toLocaleDateString('ru-RU', { weekday: 'short' }) + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      h += `<div class="log-row"><span>${t ? esc(t.icon) : '•'}</span><span>${t ? esc(t.name) : 'Удалённое дело'} <small>+${e.pts}</small></span><small>${when}</small><button data-undo="${e.id}" aria-label="Отменить">✕</button></div>`;
    }
    h += '</div>';
    p.innerHTML = h;
  }
  $('#p-tasks').addEventListener('click', e => {
    const u = e.target.closest('[data-undo]');
    if (u) {
      if (G.removeEntry(+u.dataset.undo)) { sfx.undo(); G.save(); Scene.setLevel(G.levelFloat()); renderAll(); }
      return;
    }
    const b = e.target.closest('.task'); if (!b) return;
    const id = b.dataset.id, t = G.task(id);
    const ev = G.logTask(id); G.save();
    sfx.tap(); buzz(12);
    Scene.floatText('+' + t.pts); Scene.setLevel(G.levelFloat());
    renderAll();
    const nb = document.querySelector(`.task[data-id="${CSS.escape(id)}"]`); if (nb) { nb.classList.add('pop'); }
    handleEvents(ev);
  });

  // ---------- Неделя ----------
  function renderWeek() {
    const w = G.curWeek(), goals = G.goalsFor(w), done = G.counts(w), left = G.daysLeft();
    const ids = Object.keys(goals);
    const ok = ids.filter(id => (done[id] || 0) >= goals[id]).length;
    let h = `<div class="week-head"><h3>Неделя ${w + 1} из ${CFG.WEEKS}</h3><span>${left === 1 ? 'последний день' : `ещё ${left} ${plural(left, ['день', 'дня', 'дней'])}`}</span></div>`;
    h += `<div class="rule">Выполни все цели до конца воскресенья — течение подтолкнёт на <b class="up">+${CFG.WEEK_BONUS} уровень</b>. Не успеешь — утянет на <b class="down">−${CFG.WEEK_FALL} уровня</b> вниз.${G.isWarmup(w) ? '<br><br>Эта неделя — разминка: падения не будет.' : ''}</div>`;
    h += `<div class="sec-title">Испытание недели · ${ok} из ${ids.length}</div>`;
    if (!ids.length) h += '<div class="empty">Целей нет. Их можно задать в настройках ⚙</div>';
    for (const id of ids) {
      const t = G.task(id), n = Math.min(done[id] || 0, goals[id]);
      h += `<div class="goal ${n >= goals[id] ? 'done' : ''}"><div class="goal-top"><span>${t ? esc(t.icon + ' ' + t.name) : 'Удалённое дело'}</span><span class="cnt">${n >= goals[id] ? '✓ ' : ''}${done[id] || 0} / ${goals[id]}</span></div><div class="bar"><i style="width:${n / goals[id] * 100}%"></i></div></div>`;
    }
    h += '<div class="sec-title">Все недели</div><div class="hist">';
    for (let i = 0; i < CFG.WEEKS; i++) {
      const r = G.state.weeks.find(x => x.w === i);
      const cls = r ? (r.ok ? 'ok' : (r.delta < 0 ? 'fail' : '')) : (i === w ? 'cur' : '');
      h += `<span class="${cls}" title="Неделя ${i + 1}">${r ? (r.ok ? '+1' : r.delta < 0 ? '−2' : '·') : i + 1}</span>`;
    }
    h += '</div>';
    $('#p-week').innerHTML = h;
  }

  // ---------- Находки ----------
  function itemCanvas(id, size, has) {
    const cv = document.createElement('canvas'), d = Math.min(2, devicePixelRatio || 1);
    cv.width = cv.height = size * d; const c = cv.getContext('2d'); c.scale(d, d);
    Art.item(c, id, size / 2, size / 2, size / 46);
    if (!has) { c.globalCompositeOperation = 'source-in'; c.fillStyle = 'rgba(120,170,220,.22)'; c.fillRect(0, 0, size, size); }
    return cv;
  }
  function renderFinds() {
    const p = $('#p-finds'); p.innerHTML = '';
    const head = document.createElement('div'); head.className = 'find-progress';
    head.textContent = `Обломки старой жизни: ${G.state.found.length} из ${ITEMS.length}. Они лежат на уступах — доберись до уровня, и заберёшь.`;
    p.appendChild(head);
    const grid = document.createElement('div'); grid.className = 'finds';
    for (const it of ITEMS) {
      const has = G.state.found.includes(it.id);
      const b = document.createElement('button'); b.className = 'find' + (has ? ' has' : '');
      b.setAttribute('aria-label', has ? it.name : `Закрыто до уровня ${it.lv}`);
      b.appendChild(itemCanvas(it.id, 64, has));
      const s = document.createElement('small'); s.textContent = has ? (it.short || it.name) : 'ур. ' + it.lv; b.appendChild(s);
      if (has) b.addEventListener('click', () => showItem(it, false));
      grid.appendChild(b);
    }
    p.appendChild(grid);
  }

  // ---------- Ачивки ----------
  function renderAch() {
    let h = `<div class="find-progress">Открыто ${Object.keys(G.state.ach).length} из ${ACH.length}</div><div class="achs">`;
    const sorted = [...ACH].sort((a, b) => (!!G.state.ach[b.id]) - (!!G.state.ach[a.id]));
    for (const a of sorted) {
      const got = G.state.ach[a.id];
      h += `<div class="ach ${got ? '' : 'locked'}"><span class="ic">${a.icon}</span><span><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.desc)}${got ? ' · ' + new Date(got).toLocaleDateString('ru-RU') : ''}</div></span></div>`;
    }
    $('#p-ach').innerHTML = h + '</div>';
  }

  function renderBadges() {
    const w = G.curWeek(), goals = G.goalsFor(w), done = G.counts(w), ids = Object.keys(goals);
    $('#weekBadge').textContent = ids.length ? `${ids.filter(id => (done[id] || 0) >= goals[id]).length}/${ids.length}` : '';
    const nf = G.state.found.length - seenFinds, na = Object.keys(G.state.ach).length - seenAch;
    const fb = $('#findBadge'); fb.textContent = nf > 0 ? '+' + nf : ''; fb.classList.toggle('hot', nf > 0);
    const ab = $('#achBadge'); ab.textContent = na > 0 ? '+' + na : ''; ab.classList.toggle('hot', na > 0);
  }

  function renderAll() {
    renderHUD(); renderTasks(); renderWeek(); renderFinds(); renderAch(); renderBadges();
    Scene.setFound(G.state.found);
  }

  // ---------- тосты ----------
  function toast(icon, title, sub) {
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = `<span class="ic">${icon}</span><span><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>`;
    $('#toasts').appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 2800);
  }

  // ---------- модалки (очередь) ----------
  const queue = []; let modalOpen = false;
  function modal(build) { queue.push(build); if (!modalOpen) nextModal(); }
  function nextModal() {
    const b = queue.shift();
    if (!b) { modalOpen = false; $('#modal').hidden = true; return; }
    modalOpen = true;
    const body = $('#modalBody'), act = $('#modalActions');
    body.innerHTML = ''; act.innerHTML = '';
    const close = () => nextModal();
    const btns = b(body, close) || [{ label: 'Дальше', primary: true }];
    for (const x of btns) {
      const el = document.createElement('button'); el.className = 'btn' + (x.primary ? ' primary' : '') + (x.danger ? ' danger' : '');
      el.textContent = x.label; el.addEventListener('click', () => { if (x.onClick && x.onClick() === false) return; close(); });
      act.appendChild(el);
    }
    $('#modal').hidden = false;
    const card = $('#modal .card'); card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';
  }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && modalOpen && !$('#modal').dataset.lock) nextModal(); });

  function showItem(it, isNew) {
    modal(body => {
      const cv = itemCanvas(it.id, 140, true); cv.className = 'item-art';
      body.appendChild(cv);
      body.insertAdjacentHTML('beforeend', `<div class="center">${isNew ? '<p class="kicker">Находка · уровень ' + it.lv + '</p>' : ''}<h2>${esc(it.name)}</h2><p>${esc(it.text)}</p></div>`);
      return [{ label: isNew ? 'Забрать с собой' : 'Закрыть', primary: true }];
    });
  }

  function handleEvents(ev) {
    let lvl = null;
    for (const e of ev) {
      if (e.type === 'level') lvl = e;
      if (e.type === 'item') { setTimeout(() => { Scene.itemFx(); sfx.item(); }, 500); showItem(e.item, true); }
      if (e.type === 'ach') setTimeout(() => { sfx.ach(); toast(e.ach.icon, 'Ачивка: ' + e.ach.name, e.ach.desc); }, 700);
      if (e.type === 'surface') modal(body => { body.innerHTML = `<div class="big-ic">☀️</div><div class="center"><h2>Ты выбрался${G.state.name ? ', ' + esc(G.state.name) : ''}!</h2><p>10 994 метра. Шаг за шагом, видео за видео, урок за уроком. Это всё сделал ты.</p></div>`; return [{ label: 'Глотнуть воздуха', primary: true }]; });
    }
    if (lvl) {
      Scene.levelFx(); sfx.level(); buzz([20, 40, 20]);
      const d = depthFor(lvl.level);
      toast('⬆️', `Уровень ${lvl.level}!`, `Глубина −${fmt(d)} м · ${zoneFor(d).name}`);
    }
  }

  // ---------- итоги недель ----------
  function showWeekResults(res) {
    if (!res.length) return;
    const last = res[res.length - 1];
    const fails = res.filter(r => r.delta < 0).length;
    modal(body => {
      const r = last;
      let h = '';
      if (r.ok) h += `<div class="big-ic">🌊</div><div class="center"><h2>Испытание пройдено!</h2><p>Неделя ${r.w + 1} закрыта. Течение подталкивает тебя на уровень вверх.</p></div>`;
      else if (r.delta < 0) h += `<div class="big-ic">🌀</div><div class="center"><h2>Течение утянуло вниз</h2><p>Неделя ${r.w + 1} не добита — минус ${Math.round(-r.delta / CFG.XPL)} ${plural(Math.round(-r.delta / CFG.XPL), ['уровень', 'уровня', 'уровней'])}. Бывает. Новая неделя уже началась.</p></div>`;
      else h += `<div class="big-ic">🫧</div><div class="center"><h2>Разминка окончена</h2><p>Неделя ${r.w + 1} была пробной. Дальше — по-настоящему.</p></div>`;
      const ids = Object.keys(r.goals);
      if (ids.length) {
        h += '<div class="result-list">';
        for (const id of ids) { const t = G.task(id), n = r.done[id] || 0, ok = n >= r.goals[id]; h += `<div><span>${t ? esc(t.icon + ' ' + t.name) : id}</span><span class="${ok ? 'ok' : 'no'}">${n} / ${r.goals[id]}</span></div>`; }
        h += '</div>';
      }
      if (res.length > 1) h += `<p class="note">Пока тебя не было, закрылось ${res.length} ${plural(res.length, ['неделя', 'недели', 'недель'])}${fails ? `, провалено: ${fails}` : ''}.</p>`;
      body.innerHTML = h;
      return [{ label: r.ok ? 'Вверх!' : 'Поплыли дальше', primary: true }];
    });
    setTimeout(() => {
      Scene.setLevel(G.levelFloat(), { fast: true });
      if (last.ok) { Scene.bonusFx(); sfx.bonus(); } else if (last.delta < 0) { Scene.fallFx(); sfx.fall(); buzz([60, 40, 120]); }
    }, 400);
    res.forEach(r => handleEvents((r.events || []).filter(e => e.type !== 'level')));
  }
  function checkWeeks() {
    const res = G.resolve();
    if (res.length) { G.save(); renderAll(); showWeekResults(res); }
  }

  // ---------- справка ----------
  function showHelp() {
    modal(body => {
      body.innerHTML = `<h2>Как играть</h2><ul class="rules">
        <li><b>Отмечай дела.</b> Выложил видео, позанимался немецким, сходил на учёбу — жми на дело в панели. За каждое получаешь очки, ${CFG.XPL} очков = уровень вверх.</li>
        <li><b>Видео набрало 1000 просмотров?</b> Отметь отдельно — это бонус.</li>
        <li><b>Каждая неделя — испытание.</b> Выполнишь все цели к концу воскресенья — <b>+${CFG.WEEK_BONUS} уровень</b>. Не успеешь — течение утянет на <b>${CFG.WEEK_FALL} уровня вниз</b>.</li>
        <li><b>На уступах — обломки старой жизни.</b> Доберёшься до уровня — заберёшь. Всего ${ITEMS.length}.</li>
        <li><b>${CFG.LEVELS} уровней, ${CFG.WEEKS} недель.</b> Наверху — свет.</li>
        <li><b>Ошибся?</b> Отметку этой недели можно отменить крестиком.</li>
        <li><b>Прогресс живёт в этом браузере.</b> Сохраняй код прогресса в настройках ⚙, чтобы не потерять.</li>
      </ul>`;
      return [{ label: 'Понятно', primary: true }];
    });
  }

  // ---------- настройки ----------
  function showSettings() {
    modal((body, close) => {
      body.innerHTML = `<h2>Настройки</h2>
        <label class="field"><span>Имя</span><input id="setName" maxlength="24" value="${esc(G.state.name || '')}"></label>
        <div class="set-sec"><h3>Дела, очки и цели на неделю</h3><p class="note">Цель 0 — дело не входит в испытание недели, но очки даёт. Новые цели начнут действовать с этой недели.</p><div class="trows" id="trows"></div>
        <div class="row-btns" style="margin-top:8px"><button class="btn" id="addTask">+ Добавить дело</button></div></div>
        <div class="set-sec"><h3>Перенос прогресса</h3><p class="note">Прогресс хранится только в этом браузере. Скопируй код и сохрани в заметках — по нему можно восстановить игру на любом телефоне.</p>
        <div class="row-btns"><button class="btn" id="copyCode">Скопировать код</button><button class="btn" id="dlCode">Скачать файл</button></div>
        <textarea id="importCode" placeholder="Вставь код прогресса, чтобы загрузить его" style="margin-top:8px"></textarea>
        <div class="row-btns" style="margin-top:8px"><button class="btn" id="doImport">Загрузить код</button><label class="btn" style="display:grid;place-items:center">Загрузить файл<input type="file" id="importFile" accept=".json,.txt" hidden></label></div></div>
        <div class="set-sec"><h3>Начать заново</h3><div class="row-btns"><button class="btn danger" id="resetAll">Стереть прогресс</button></div></div>`;
      const rows = body.querySelector('#trows');
      const tasks = clone(G.state.tasks);
      const draw = () => {
        rows.innerHTML = '';
        tasks.forEach((t, i) => {
          const r = document.createElement('div'); r.className = 'trow';
          r.innerHTML = `<input class="ticon" maxlength="4" value="${esc(t.icon)}" aria-label="Значок"><input class="tname" maxlength="40" value="${esc(t.name)}" aria-label="Название"><button class="del" aria-label="Удалить">✕</button>
            <div class="nums"><label>Очки<input type="number" inputmode="numeric" min="1" max="200" value="${t.pts}" class="tpts"></label><label>Цель в неделю<input type="number" inputmode="numeric" min="0" max="14" value="${t.goal}" class="tgoal"></label></div>`;
          r.querySelector('.ticon').oninput = e => t.icon = e.target.value;
          r.querySelector('.tname').oninput = e => t.name = e.target.value;
          r.querySelector('.tpts').oninput = e => t.pts = e.target.value;
          r.querySelector('.tgoal').oninput = e => t.goal = e.target.value;
          r.querySelector('.del').onclick = () => { if (confirm(`Удалить «${t.name}»? Старые отметки останутся.`)) { tasks.splice(i, 1); draw(); } };
          rows.appendChild(r);
        });
      };
      draw();
      body.querySelector('#addTask').onclick = () => { tasks.push({ id: 't' + Date.now().toString(36), icon: '⭐', name: 'Новое дело', pts: 10, goal: 0 }); draw(); rows.lastChild.querySelector('.tname').select(); };
      body.querySelector('#copyCode').onclick = async e => {
        const code = G.exportCode();
        try { await navigator.clipboard.writeText(code); e.target.textContent = 'Скопировано ✓'; }
        catch (_) { body.querySelector('#importCode').value = code; body.querySelector('#importCode').select(); e.target.textContent = 'Код ниже — скопируй'; }
      };
      body.querySelector('#dlCode').onclick = () => {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([G.exportCode()], { type: 'text/plain' }));
        a.download = `vsplytie-${new Date().toISOString().slice(0, 10)}.txt`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      const doImport = code => {
        if (!confirm('Заменить текущий прогресс загруженным?')) return;
        if (G.importCode(code)) location.reload(); else alert('Код не подошёл. Проверь, что скопирован полностью.');
      };
      body.querySelector('#doImport').onclick = () => doImport(body.querySelector('#importCode').value);
      body.querySelector('#importFile').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(doImport); };
      body.querySelector('#resetAll').onclick = () => {
        if (confirm('Точно стереть весь прогресс? Это нельзя отменить.')) { try { localStorage.removeItem(CFG.SAVE_KEY); } catch (_) { } location.reload(); }
      };
      return [
        { label: 'Отмена' },
        {
          label: 'Сохранить', primary: true, onClick: () => {
            const clean = tasks.map(t => ({ ...t, icon: (t.icon || '⭐').trim() || '⭐', name: (t.name || '').trim() || 'Дело', pts: Math.max(1, Math.min(200, Math.round(+t.pts) || 10)), goal: Math.max(0, Math.min(14, Math.round(+t.goal) || 0)) }));
            G.state.tasks = clean;
            G.state.name = body.querySelector('#setName').value.trim().slice(0, 24);
            G.state.weekGoals[G.curWeek()] = G.goalsNow();
            G.save(); renderAll();
          }
        },
      ];
    });
  }

  $('#btnHelp').onclick = showHelp;
  $('#btnSettings').onclick = showSettings;
  $('#btnSound').onclick = () => { G.state.muted = !G.state.muted; G.save(); renderHUD(); if (!G.state.muted) sfx.tap(); };

  // ---------- запуск ----------
  function startPlaying(first) {
    document.body.classList.remove('booting');
    seenFinds = G.state.found.length; seenAch = Object.keys(G.state.ach).length;
    G.ensureWeekGoals();
    renderAll(); updateView();
    if (first) return;
    Scene.setLevel(G.levelFloat(), { instant: true });
    checkWeeks();
  }

  function runIntro() {
    const it = $('#introText');
    document.body.classList.remove('booting'); document.body.classList.add('intro');
    updateView();
    Scene.intro(() => {
      it.innerHTML = `−10 994 м<small>Дно Марианской впадины. Отсюда только вверх.</small>`;
      it.classList.add('on'); sfx.fall();
      setTimeout(() => {
        it.classList.remove('on');
        document.body.classList.remove('intro');
        G.state.introSeen = true; G.save();
        startPlaying(true);
        Scene.setLevel(0);
        setTimeout(() => modal(body => {
          const cv = document.createElement('canvas'), d = Math.min(2, devicePixelRatio || 1); cv.width = 200 * d; cv.height = 130 * d; cv.style.cssText = 'display:block;width:200px;height:130px;margin:0 auto 6px';
          const cc = cv.getContext('2d'); cc.scale(d, d); Art.shiba(cc, 92, 74, 2.6, 0.4, 1);
          body.appendChild(cv);
          body.insertAdjacentHTML('beforeend', `<div class="center"><h2>${G.state.name ? esc(G.state.name) + ', ты' : 'Ты'} не один</h2><p>Шиба провалилась вместе с тобой и уже гребёт вверх. Отмечай дела — и вы будете всплывать.</p></div>`);
          return [{ label: 'Как играть', onClick: () => { setTimeout(showHelp, 50); } }, { label: 'Поплыли', primary: true }];
        }), 500);
      }, 2600);
    });
  }

  $('#btnStart').onclick = () => {
    audio();
    G.state = G.fresh($('#nameInput').value);
    G.ensureWeekGoals(); G.save();
    $('#start').hidden = true;
    runIntro();
  };
  $('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnStart').click(); });
  $('#btnStartImport').onclick = () => {
    const code = prompt('Вставь код прогресса:');
    if (code && G.importCode(code)) location.reload(); else if (code) alert('Код не подошёл.');
  };

  // для отладки и проверок
  const qs = new URLSearchParams(location.search);
  if (qs.has('debug')) {
    window.__timeOffset = +(sessionStorage.getItem('vsp-offset') || 0);
    window.debugAddDays = n => { window.__timeOffset += n * DAY; sessionStorage.setItem('vsp-offset', window.__timeOffset); checkWeeks(); renderAll(); };
  }
  window.render_game_to_text = () => JSON.stringify({
    started: !!G.state, level: G.state && G.levelFloat(), depth: G.state && depthFor(G.levelFloat()), week: G.state && G.curWeek(),
    found: G.state && G.state.found.length, ach: G.state && Object.keys(G.state.ach).length, scene: Scene.debug(), modal: modalOpen,
  });

  Scene.init($('#scene'));
  if (G.load()) startPlaying(false);
  else {
    G.state = G.fresh(''); // временно, для отрисовки
    Scene.setLevel(CFG.LEVELS * 0.08, { instant: true });
    document.body.classList.remove('booting');
    document.body.classList.add('intro');
    $('#start').hidden = false; updateView();
    G.state = null;
  }
  setInterval(() => { if (G.state && !document.body.classList.contains('intro')) checkWeeks(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && G.state && !document.body.classList.contains('intro')) { checkWeeks(); renderAll(); } });
})();

</script>
</body>
</html>
